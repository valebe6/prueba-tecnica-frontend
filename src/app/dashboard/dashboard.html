<app-navbar></app-navbar>

<div class="dashboard">
  <div class="dashboard-header">
    <h1>Dashboard</h1>
    <p>Resumen general de tus notas</p>
  </div>

  @if (error) {
    <div class="error">
      {{ error }}
    </div>
  }

  @if (!metrics && !error) {
    <div class="loading">Cargando métricas...</div>
  }

  @if (metrics) {
    <div class="cards">
      <div class="card">
        <h2>Total de notas</h2>
        <strong>{{ metrics.total }}</strong>
      </div>

      <div class="card">
        <h2>Pendientes</h2>
        <strong>{{ metrics.pending }}</strong>
      </div>

      <div class="card">
        <h2>En curso</h2>
        <strong>{{ metrics.inProgress }}</strong>
      </div>

      <div class="card">
        <h2>Hechas</h2>
        <strong>{{ metrics.done }}</strong>
      </div>
    </div>
  }
</div>
